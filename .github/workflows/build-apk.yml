name: Build Formation Maker APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build release APK
        working-directory: formation-app
        run: gradle --no-daemon assembleRelease

      - name: Copy APK into repo
        run: |
          mkdir -p release
          cp formation-app/app/build/outputs/apk/release/app-release.apk release/FormationMaker.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FormationMaker-apk
          path: release/FormationMaker.apk

      - name: Commit APK back to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add release/FormationMaker.apk
          if git diff --cached --quiet; then
            echo "APK unchanged"
          else
            git commit -m "Add built FormationMaker.apk [skip ci]"
            git push
          fi
