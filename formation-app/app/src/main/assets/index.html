<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>フォーメーションメーカー</title>
<style>
  :root {
    --bg: #12141a;
    --panel: #1e222b;
    --panel2: #2a2f3b;
    --text: #e8eaf0;
    --dim: #9aa2b1;
    --accent: #4f8cff;
    --accent2: #37c978;
    --danger: #ff5d6c;
    --chip: #262b36;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: var(--bg); color: var(--text);
    font-family: "Hiragino Sans", "Noto Sans JP", sans-serif;
    display: flex; flex-direction: column;
    touch-action: none;
  }
  header {
    display: flex; align-items: center; gap: 6px;
    padding: 8px 10px; background: var(--panel);
    flex: none; z-index: 5;
  }
  #projName {
    flex: 1; font-size: 15px; font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .iconBtn {
    border: none; background: var(--panel2); color: var(--text);
    width: 38px; height: 38px; border-radius: 10px; font-size: 17px;
    flex: none; display: flex; align-items: center; justify-content: center;
  }
  .iconBtn:active { background: #3a4152; }
  .iconBtn.on { background: var(--accent); color: #fff; }
  .iconBtn:disabled { opacity: 0.35; }
  #stageWrap { flex: 1; position: relative; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  #sideTools {
    position: absolute; right: 8px; top: 8px;
    display: flex; flex-direction: column; gap: 8px;
  }
  #hint {
    position: absolute; left: 8px; bottom: 8px; right: 60px;
    color: var(--dim); font-size: 11px; pointer-events: none;
  }
  footer { flex: none; background: var(--panel); padding: 8px; z-index: 5; }
  #timelineRow { display: flex; align-items: center; gap: 8px; }
  #playBtn {
    width: 46px; height: 46px; border-radius: 50%;
    border: none; background: var(--accent2); color: #fff; font-size: 18px; flex: none;
  }
  #playBtn.playing { background: var(--danger); }
  #timeline {
    flex: 1; display: flex; gap: 6px; overflow-x: auto; padding: 2px;
    scrollbar-width: none;
  }
  #timeline::-webkit-scrollbar { display: none; }
  .fchip {
    flex: none; min-width: 64px; padding: 6px 10px; border-radius: 10px;
    background: var(--chip); border: 2px solid transparent; text-align: center;
  }
  .fchip.cur { border-color: var(--accent); background: #2b3752; }
  .fchip .fname { font-size: 12px; font-weight: 600; }
  .fchip .fmeta { font-size: 10px; color: var(--dim); margin-top: 2px; }
  .fchip .fnote { color: #ffd76a; }
  #addFormBtn {
    flex: none; width: 46px; height: 46px; border-radius: 10px; border: none;
    background: var(--panel2); color: var(--text); font-size: 20px;
  }
  /* modal */
  #overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.55);
    display: none; align-items: flex-end; justify-content: center; z-index: 20;
  }
  #overlay.show { display: flex; }
  #modal {
    background: var(--panel); width: 100%; max-width: 560px;
    max-height: 82%; overflow-y: auto;
    border-radius: 16px 16px 0 0; padding: 16px 16px 24px;
  }
  #modal h2 { font-size: 16px; margin-bottom: 12px; }
  #modal h3 { font-size: 13px; color: var(--dim); margin: 14px 0 6px; }
  .mrow { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
  .btn {
    border: none; border-radius: 10px; padding: 10px 14px;
    background: var(--panel2); color: var(--text); font-size: 14px;
  }
  .btn:active { background: #3a4152; }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn.green { background: var(--accent2); color: #fff; }
  .btn.danger { background: #59303a; color: #ffb3ba; }
  .btn.wide { width: 100%; text-align: left; margin-bottom: 8px; }
  input[type=text], input[type=number], textarea, select {
    background: var(--panel2); border: 1px solid #3a4152; color: var(--text);
    border-radius: 8px; padding: 9px 10px; font-size: 14px;
  }
  input[type=number] { width: 76px; }
  textarea { width: 100%; min-height: 84px; }
  .drow {
    display: flex; align-items: center; gap: 8px; padding: 6px 0;
    border-bottom: 1px solid #2a2f3b;
  }
  .swatch {
    width: 30px; height: 30px; border-radius: 50%; flex: none;
    border: 2px solid #fff3;
  }
  .drow input[type=text] { flex: 1; min-width: 0; }
  .drow .selBox { width: 20px; height: 20px; flex: none; }
  .palette { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; }
  .palette .swatch.sel { border-color: #fff; }
  .toolGrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .helpText { font-size: 13px; line-height: 1.75; color: var(--text); }
  .helpText b { color: var(--accent); }
  .projRow { display: flex; gap: 8px; align-items: center; padding: 8px 0; border-bottom: 1px solid #2a2f3b; }
  .projRow .pname { flex: 1; font-size: 14px; }
  .projRow .pdate { font-size: 11px; color: var(--dim); }
  #musicRow {
    display: none; align-items: center; gap: 8px; margin-bottom: 6px;
    font-size: 11px; color: var(--dim);
  }
  #musicRow.show { display: flex; }
  #musicRow input[type=range] { flex: 1; padding: 0; accent-color: var(--accent); }
  #markBtn {
    display: none; border: none; background: #6a4fd0; color: #fff;
    border-radius: 10px; padding: 6px 12px; font-size: 13px; flex: none;
  }
  #markBtn.show { display: block; }
  #toast {
    position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%);
    background: #000c; color: #fff; padding: 10px 18px; border-radius: 20px;
    font-size: 13px; z-index: 40; display: none; white-space: nowrap;
  }
</style>
</head>
<body>
<header>
  <div id="projName">新しい作品</div>
  <button class="iconBtn" id="undoBtn" title="元に戻す">↩</button>
  <button class="iconBtn" id="redoBtn" title="やり直す">↪</button>
  <button class="iconBtn" id="dancersBtn" title="メンバー">👥</button>
  <button class="iconBtn" id="toolsBtn" title="整列ツール">⊞</button>
  <button class="iconBtn" id="menuBtn" title="メニュー">☰</button>
</header>

<div id="stageWrap">
  <canvas id="cv"></canvas>
  <div id="sideTools">
    <button class="iconBtn" id="fitBtn" title="全体表示">⤢</button>
    <button class="iconBtn" id="snapBtn" title="グリッド吸着">🧲</button>
    <button class="iconBtn" id="ghostBtn" title="前の隊形を表示">👣</button>
    <button class="iconBtn" id="multiBtn" title="複数選択">☑</button>
    <button class="iconBtn" id="musicBtn" title="音楽">🎵</button>
  </div>
  <div id="hint"></div>
</div>

<footer>
  <div id="musicRow">
    <span id="mTime">0:00.0</span>
    <input type="range" id="seek" min="0" max="1000" value="0">
    <span id="mDur">0:00.0</span>
    <button id="markBtn">⏱ マーク</button>
  </div>
  <div id="timelineRow">
    <button id="playBtn">▶</button>
    <div id="timeline"></div>
    <button id="addFormBtn" title="隊形を追加">＋</button>
  </div>
</footer>

<div id="overlay"><div id="modal"></div></div>
<div id="toast"></div>
<input type="file" id="fileInput" accept=".json,application/json,text/plain,*/*" style="display:none">
<input type="file" id="musicInput" accept="audio/*" style="display:none">

<script>
"use strict";
/* ================= 基本データ ================= */
const PALETTE = ["#4f8cff","#ff5d6c","#37c978","#ffb340","#b57bff","#3ecfe0",
                 "#ff7ab0","#a4d144","#ff8a5c","#8ea0ff","#e6c94d","#7fe0b0"];
const LS_PROJECTS = "fm_projects_v1";
const LS_CURRENT  = "fm_current_v1";

let state = null;          // 現在の作品データ
let curProjId = null;
let curF = 0;              // 現在の隊形index
let selected = new Set();  // 選択中ダンサーid
let multiMode = false;
let snapOn = true;
let ghostOn = true;
let undoStack = [], redoStack = [];
let playing = false, playReq = 0;
let playPos = null;        // 再生中の補間位置 {did:[x,y]}
let playInfo = "";

function uid() { return Math.random().toString(36).slice(2, 9); }

function newProject(name) {
  const d1 = { id: uid(), name: "メンバー1", color: PALETTE[0] };
  const d2 = { id: uid(), name: "メンバー2", color: PALETTE[1] };
  const d3 = { id: uid(), name: "メンバー3", color: PALETTE[2] };
  const st = {
    ver: 1, name: name || "新しい作品",
    stage: { w: 12, d: 8 },
    bpm: 120,
    dancers: [d1, d2, d3],
    formations: [{
      id: uid(), name: "隊形 1", note: "", counts: 8,
      pos: { [d1.id]: [5, 4], [d2.id]: [6, 3], [d3.id]: [7, 4] }
    }]
  };
  return st;
}

/* ================= 保存/読込 ================= */
function loadProjects() {
  try { return JSON.parse(localStorage.getItem(LS_PROJECTS)) || {}; }
  catch (e) { return {}; }
}
function saveNow() {
  if (!state || !curProjId) return;
  const all = loadProjects();
  all[curProjId] = { name: state.name, updated: Date.now(), data: state };
  localStorage.setItem(LS_PROJECTS, JSON.stringify(all));
  localStorage.setItem(LS_CURRENT, curProjId);
}
function openProject(id) {
  const all = loadProjects();
  if (!all[id]) return false;
  stopPlay();
  curProjId = id;
  state = all[id].data;
  curF = 0; selected.clear(); undoStack = []; redoStack = [];
  localStorage.setItem(LS_CURRENT, id);
  setupAudioForProject();
  refreshAll(); fitView();
  return true;
}
function createProject(st) {
  stopPlay();
  curProjId = uid();
  state = st;
  curF = 0; selected.clear(); undoStack = []; redoStack = [];
  saveNow();
  setupAudioForProject();
  refreshAll(); fitView();
}

/* ================= undo/redo ================= */
function pushUndo() {
  undoStack.push(JSON.stringify({ s: state, f: curF }));
  if (undoStack.length > 60) undoStack.shift();
  redoStack = [];
  updateUndoBtns();
}
function doUndo() {
  if (!undoStack.length) return;
  redoStack.push(JSON.stringify({ s: state, f: curF }));
  const p = JSON.parse(undoStack.pop());
  state = p.s; curF = Math.min(p.f, state.formations.length - 1);
  selected.clear(); saveNow(); refreshAll();
}
function doRedo() {
  if (!redoStack.length) return;
  undoStack.push(JSON.stringify({ s: state, f: curF }));
  const p = JSON.parse(redoStack.pop());
  state = p.s; curF = Math.min(p.f, state.formations.length - 1);
  selected.clear(); saveNow(); refreshAll();
}
function updateUndoBtns() {
  document.getElementById("undoBtn").disabled = !undoStack.length;
  document.getElementById("redoBtn").disabled = !redoStack.length;
}
// 変更操作ラッパー
function mutate(fn) {
  if (playing) return;
  pushUndo(); fn(); saveNow(); refreshAll();
}

/* ================= ビュー(canvas) ================= */
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");
let view = { scale: 40, ox: 0, oy: 0 };  // px/m, オフセットpx
const DPR = window.devicePixelRatio || 1;

function resizeCanvas() {
  const r = cv.parentElement.getBoundingClientRect();
  cv.width = r.width * DPR; cv.height = r.height * DPR;
  render();
}
window.addEventListener("resize", () => { resizeCanvas(); fitView(); });

function fitView() {
  const r = cv.parentElement.getBoundingClientRect();
  const m = 30;
  const s = Math.min((r.width - m * 2) / state.stage.w, (r.height - m * 2 - 20) / state.stage.d);
  view.scale = Math.max(8, s);
  view.ox = (r.width - state.stage.w * view.scale) / 2;
  view.oy = (r.height - 20 - state.stage.d * view.scale) / 2;
  render();
}
function w2s(x, y) { return [view.ox + x * view.scale, view.oy + y * view.scale]; }
function s2w(px, py) { return [(px - view.ox) / view.scale, (py - view.oy) / view.scale]; }

function dancerById(id) { return state.dancers.find(d => d.id === id); }
function curForm() { return state.formations[curF]; }
function shortName(n) {
  n = (n || "").trim();
  if (n.length <= 3) return n;
  const m = n.match(/(\d+)\s*$/);          // 「メンバー12」→「12」のように末尾の番号を優先
  if (m) return m[1].slice(0, 3);
  return n.slice(0, 3);
}

// 汎用: 任意のctxへ1隊形を描画（PNG書き出しと共用）
function drawFormation(c, form, sc, ox, oy, opts) {
  opts = opts || {};
  const W = state.stage.w, D = state.stage.d;
  // ステージ
  c.fillStyle = opts.light ? "#f5f6fa" : "#1b2029";
  c.fillRect(ox, oy, W * sc, D * sc);
  c.strokeStyle = opts.light ? "#c8ccd8" : "#39404f";
  c.lineWidth = 1;
  // 1mグリッド
  c.beginPath();
  for (let x = 1; x < W; x++) { c.moveTo(ox + x * sc, oy); c.lineTo(ox + x * sc, oy + D * sc); }
  for (let y = 1; y < D; y++) { c.moveTo(ox, oy + y * sc); c.lineTo(ox + W * sc, oy + y * sc); }
  c.stroke();
  // センターライン
  c.strokeStyle = opts.light ? "#9aa2b8" : "#4c5568";
  c.setLineDash([6, 5]);
  c.beginPath();
  c.moveTo(ox + W / 2 * sc, oy); c.lineTo(ox + W / 2 * sc, oy + D * sc);
  c.stroke(); c.setLineDash([]);
  // 枠
  c.strokeStyle = opts.light ? "#7d8598" : "#5b6479";
  c.lineWidth = 2;
  c.strokeRect(ox, oy, W * sc, D * sc);
  // ダンサー
  const rad = Math.max(7, Math.min(0.35 * sc, 26));
  for (const d of state.dancers) {
    const p = form.pos[d.id]; if (!p) continue;
    const px = ox + p[0] * sc, py = oy + p[1] * sc;
    c.beginPath(); c.arc(px, py, rad, 0, Math.PI * 2);
    c.fillStyle = d.color; c.fill();
    if (selected.has(d.id) && opts.sel) {
      c.lineWidth = 3; c.strokeStyle = "#ffffff"; c.stroke();
    }
    c.fillStyle = "#fff";
    c.font = "bold " + Math.max(9, rad * 0.72) + "px sans-serif";
    c.textAlign = "center"; c.textBaseline = "middle";
    c.fillText(shortName(d.name), px, py);
  }
}

function render() {
  const w = cv.width, h = cv.height;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, w, h);
  if (!state) return;
  const sc = view.scale, ox = view.ox, oy = view.oy;
  const W = state.stage.w, D = state.stage.d;
  const form = curForm();

  // 背景ステージ（現在の隊形 or 再生/プレビュー位置）
  const usePlay = (playing || previewing) && playPos;
  const posOf = id => (usePlay && playPos[id]) ? playPos[id] : form.pos[id];

  // ステージ本体はdrawFormationの前半と同じ描き方をするため一旦ダミーformで枠のみ
  drawFormation(ctx, { pos: {} }, sc, ox, oy, {});

  // 客席ラベル
  ctx.fillStyle = "#9aa2b1";
  ctx.font = "12px sans-serif";
  ctx.textAlign = "center"; ctx.textBaseline = "top";
  ctx.fillText("▼ 客席（正面） ▼", ox + W / 2 * sc, oy + D * sc + 6);
  ctx.textBaseline = "bottom";
  ctx.fillText("奥（バック）", ox + W / 2 * sc, oy - 6);

  const rad = Math.max(10, Math.min(0.35 * sc, 30));

  // ゴースト（前の隊形）と移動矢印
  if (ghostOn && !playing && !previewing && curF > 0) {
    const prev = state.formations[curF - 1];
    for (const d of state.dancers) {
      const pp = prev.pos[d.id], cp = form.pos[d.id];
      if (!pp) continue;
      const [gx, gy] = w2s(pp[0], pp[1]);
      ctx.globalAlpha = 0.28;
      ctx.beginPath(); ctx.arc(gx, gy, rad, 0, Math.PI * 2);
      ctx.fillStyle = d.color; ctx.fill();
      ctx.globalAlpha = 1;
      if (cp && (Math.abs(cp[0] - pp[0]) > 0.05 || Math.abs(cp[1] - pp[1]) > 0.05)) {
        const [cx2, cy2] = w2s(cp[0], cp[1]);
        const ang = Math.atan2(cy2 - gy, cx2 - gx);
        const ex = cx2 - Math.cos(ang) * (rad + 4), ey = cy2 - Math.sin(ang) * (rad + 4);
        ctx.strokeStyle = "#8891a5"; ctx.lineWidth = 1.5; ctx.setLineDash([5, 4]);
        ctx.beginPath(); ctx.moveTo(gx, gy); ctx.lineTo(ex, ey); ctx.stroke();
        ctx.setLineDash([]);
        ctx.beginPath();
        ctx.moveTo(ex, ey);
        ctx.lineTo(ex - Math.cos(ang - 0.4) * 9, ey - Math.sin(ang - 0.4) * 9);
        ctx.lineTo(ex - Math.cos(ang + 0.4) * 9, ey - Math.sin(ang + 0.4) * 9);
        ctx.closePath(); ctx.fillStyle = "#8891a5"; ctx.fill();
      }
    }
  }

  // ダンサー本体
  for (const d of state.dancers) {
    const p = posOf(d.id); if (!p) continue;
    const [px, py] = w2s(p[0], p[1]);
    ctx.beginPath(); ctx.arc(px, py, rad, 0, Math.PI * 2);
    ctx.fillStyle = d.color; ctx.fill();
    if (selected.has(d.id)) { ctx.lineWidth = 3; ctx.strokeStyle = "#ffffff"; ctx.stroke(); }
    ctx.fillStyle = "#fff";
    ctx.font = "bold " + Math.max(10, rad * 0.66) + "px sans-serif";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(shortName(d.name), px, py);
    // フルネームを下に
    if (rad * 0.66 < 22 && sc > 24) {
      ctx.fillStyle = "#c6ccd9"; ctx.font = "10px sans-serif";
      ctx.textBaseline = "top";
      ctx.fillText(d.name, px, py + rad + 3);
    }
  }

  // ヒント表示
  const hint = document.getElementById("hint");
  if (playing) hint.textContent = playInfo;
  else hint.textContent = form.name + (form.note ? "　📝 " + form.note : "") +
    (multiMode ? "　［複数選択モード］" : "");
}

/* ================= ポインタ操作 ================= */
let pointers = new Map();
let dragId = null, dragMoved = false, dragUndoPushed = false;
let panStart = null, pinchStart = null;

cv.addEventListener("pointerdown", e => {
  cv.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (playing) return;
  if (previewing) { previewing = false; render(); }
  if (pointers.size === 1) {
    const rect = cv.getBoundingClientRect();
    const [wx, wy] = s2w(e.clientX - rect.left, e.clientY - rect.top);
    // ダンサーヒット判定（近い順）
    const rad = Math.max(10, Math.min(0.35 * view.scale, 30)) / view.scale + 0.15;
    let hit = null, best = 1e9;
    for (const d of state.dancers) {
      const p = curForm().pos[d.id]; if (!p) continue;
      const dd = Math.hypot(p[0] - wx, p[1] - wy);
      if (dd < rad && dd < best) { best = dd; hit = d.id; }
    }
    if (hit) {
      if (multiMode) {
        if (selected.has(hit)) selected.delete(hit); else selected.add(hit);
      } else {
        if (!selected.has(hit)) { selected.clear(); selected.add(hit); }
      }
      dragId = hit; dragMoved = false; dragUndoPushed = false;
    } else {
      if (!multiMode) selected.clear();
      dragId = null;
      panStart = { x: e.clientX, y: e.clientY, ox: view.ox, oy: view.oy };
    }
    render();
  } else if (pointers.size === 2) {
    dragId = null; panStart = null;
    const ps = [...pointers.values()];
    pinchStart = {
      dist: Math.hypot(ps[0].x - ps[1].x, ps[0].y - ps[1].y),
      cx: (ps[0].x + ps[1].x) / 2, cy: (ps[0].y + ps[1].y) / 2,
      scale: view.scale, ox: view.ox, oy: view.oy
    };
  }
});

cv.addEventListener("pointermove", e => {
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pinchStart && pointers.size === 2) {
    const ps = [...pointers.values()];
    const nd = Math.hypot(ps[0].x - ps[1].x, ps[0].y - ps[1].y);
    const ncx = (ps[0].x + ps[1].x) / 2, ncy = (ps[0].y + ps[1].y) / 2;
    const k = Math.max(0.2, Math.min(5, nd / (pinchStart.dist || 1)));
    view.scale = Math.max(6, Math.min(300, pinchStart.scale * k));
    const kk = view.scale / pinchStart.scale;
    view.ox = ncx - (pinchStart.cx - pinchStart.ox) * kk;
    view.oy = ncy - (pinchStart.cy - pinchStart.oy) * kk;
    render(); return;
  }
  if (playing) return;
  if (dragId) {
    const rect = cv.getBoundingClientRect();
    let [wx, wy] = s2w(e.clientX - rect.left, e.clientY - rect.top);
    if (!dragUndoPushed) { pushUndo(); dragUndoPushed = true; }
    dragMoved = true;
    if (snapOn) { wx = Math.round(wx * 2) / 2; wy = Math.round(wy * 2) / 2; }
    wx = Math.max(0, Math.min(state.stage.w, wx));
    wy = Math.max(0, Math.min(state.stage.d, wy));
    const form = curForm();
    const base = form.pos[dragId];
    const dx = wx - base[0], dy = wy - base[1];
    // 選択中の全員を一緒に動かす
    const targets = selected.has(dragId) ? [...selected] : [dragId];
    for (const id of targets) {
      const p = form.pos[id]; if (!p) continue;
      p[0] = Math.max(0, Math.min(state.stage.w, p[0] + dx));
      p[1] = Math.max(0, Math.min(state.stage.d, p[1] + dy));
    }
    render();
  } else if (panStart) {
    view.ox = panStart.ox + (e.clientX - panStart.x);
    view.oy = panStart.oy + (e.clientY - panStart.y);
    render();
  }
});

function endPointer(e) {
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinchStart = null;
  if (dragId) {
    if (dragMoved) { saveNow(); renderTimeline(); }
    dragId = null;
  }
  panStart = null;
}
cv.addEventListener("pointerup", endPointer);
cv.addEventListener("pointercancel", endPointer);

cv.addEventListener("wheel", e => {
  e.preventDefault();
  const k = e.deltaY < 0 ? 1.12 : 0.9;
  const ns = Math.max(6, Math.min(300, view.scale * k));
  const rect = cv.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  view.ox = mx - (mx - view.ox) * (ns / view.scale);
  view.oy = my - (my - view.oy) * (ns / view.scale);
  view.scale = ns;
  render();
}, { passive: false });

/* ================= 再生 ================= */
function stopPlay() {
  playing = false; playPos = null; previewing = false;
  if (audioEl) audioEl.pause();
  document.getElementById("markBtn").classList.remove("show");
  cancelAnimationFrame(playReq);
  document.getElementById("playBtn").textContent = "▶";
  document.getElementById("playBtn").classList.remove("playing");
  if (state) { render(); renderTimeline(); }
}
document.getElementById("playBtn").onclick = () => {
  if (playing) { stopPlay(); return; }
  if (musicReady) { musicPlay(); return; }   // 音楽があれば音楽同期再生
  if (state.formations.length < 2) { toast("隊形が2つ以上必要です"); return; }
  playing = true;
  document.getElementById("playBtn").textContent = "■";
  document.getElementById("playBtn").classList.add("playing");
  const HOLD = 0.7; // 各隊形で静止する秒数
  const secPerCount = 60 / (state.bpm || 120);
  // セグメント列を構築
  const segs = [];
  segs.push({ type: "hold", f: 0, dur: HOLD });
  for (let i = 1; i < state.formations.length; i++) {
    segs.push({ type: "move", from: i - 1, to: i, dur: Math.max(0.3, state.formations[i].counts * secPerCount) });
    segs.push({ type: "hold", f: i, dur: HOLD });
  }
  let si = 0, t0 = performance.now();
  const step = now => {
    if (!playing) return;
    let el = (now - t0) / 1000;
    while (si < segs.length && el >= segs[si].dur) {
      el -= segs[si].dur; t0 = now - el * 1000; si++;
    }
    if (si >= segs.length) { stopPlay(); return; }
    const s = segs[si];
    playPos = {};
    if (s.type === "hold") {
      const f = state.formations[s.f];
      curF = s.f;
      for (const d of state.dancers) if (f.pos[d.id]) playPos[d.id] = f.pos[d.id].slice();
      playInfo = "▶ " + f.name;
    } else {
      const a = state.formations[s.from], b = state.formations[s.to];
      const t = el / s.dur, tt = t * t * (3 - 2 * t); // ease
      curF = s.to;
      for (const d of state.dancers) {
        const pa = a.pos[d.id], pb = b.pos[d.id];
        if (pa && pb) playPos[d.id] = [pa[0] + (pb[0] - pa[0]) * tt, pa[1] + (pb[1] - pa[1]) * tt];
        else if (pb) playPos[d.id] = pb.slice();
      }
      playInfo = "▶ " + a.name + " → " + b.name + "（" + b.counts + "カウント / BPM" + state.bpm + "）";
    }
    render(); tlUpdate();
    playReq = requestAnimationFrame(step);
  };
  playReq = requestAnimationFrame(step);
};

/* ---- 整列ツール & 設定 ---- */
document.getElementById("toolsBtn").onclick = () => {
  if (playing) return;
  const selN = selected.size;
  openModal(
    '<h2>整列ツール</h2>' +
    '<p style="font-size:12px;color:var(--dim);margin-bottom:8px">対象: ' +
    (selN ? '選択中の' + selN + '人' : '全員（誰も選択していないため）') + '</p>' +
    '<div class="toolGrid">' +
    '<button class="btn" data-a="row">― 横一列</button>' +
    '<button class="btn" data-a="col">｜ 縦一列</button>' +
    '<button class="btn" data-a="circle">◯ 円形</button>' +
    '<button class="btn" data-a="vshape">Ｖ字</button>' +
    '<button class="btn" data-a="grid2">▤ 2列</button>' +
    '<button class="btn" data-a="center">中央へ寄せる</button>' +
    '</div>' +
    '<h3>ステージ設定</h3>' +
    '<div class="mrow">幅 <input type="number" id="stW" min="4" max="60" step="1" value="' + state.stage.w + '"> m　' +
    '奥行 <input type="number" id="stD" min="3" max="40" step="1" value="' + state.stage.d + '"> m</div>' +
    '<h3>再生テンポ</h3>' +
    '<div class="mrow">BPM <input type="number" id="bpmIn" min="40" max="240" value="' + state.bpm + '">' +
    '<span style="font-size:12px;color:var(--dim)">移動カウント数は各隊形の設定で変更</span></div>' +
    '<div class="mrow" style="margin-top:12px"><button class="btn primary" id="applySet">適用して閉じる</button></div>'
  );
  const target = () => selN ? state.dancers.filter(d => selected.has(d.id)) : state.dancers.slice();
  modal.querySelectorAll("[data-a]").forEach(b => {
    b.onclick = () => {
      const ds = target(); if (!ds.length) return;
      const W = state.stage.w, D = state.stage.d, n = ds.length;
      mutate(() => {
        const f = curForm();
        ds.forEach((d, i) => {
          let x, y;
          if (b.dataset.a === "row") {
            const gap = Math.min(2, (W - 2) / Math.max(1, n - 1));
            x = W / 2 + (i - (n - 1) / 2) * gap; y = D / 2;
          } else if (b.dataset.a === "col") {
            const gap = Math.min(2, (D - 2) / Math.max(1, n - 1));
            x = W / 2; y = D / 2 + (i - (n - 1) / 2) * gap;
          } else if (b.dataset.a === "circle") {
            const r = Math.min(W, D) / 2 - 1;
            const a = -Math.PI / 2 + i * 2 * Math.PI / n;
            x = W / 2 + r * Math.cos(a); y = D / 2 + r * Math.sin(a);
          } else if (b.dataset.a === "vshape") {
            const half = Math.floor(n / 2);
            const k = i - half;
            x = W / 2 + k * 1.2;
            y = D / 2 - Math.abs(k) * 1.0 + n / 4;
          } else if (b.dataset.a === "grid2") {
            const perRow = Math.ceil(n / 2);
            const gap = Math.min(2, (W - 2) / Math.max(1, perRow - 1));
            const r0 = Math.floor(i / perRow), c0 = i % perRow;
            x = W / 2 + (c0 - (perRow - 1) / 2) * gap;
            y = D / 2 + (r0 - 0.5) * 1.6;
          } else { // center
            const p = f.pos[d.id];
            x = p[0] + (W / 2 - p[0]) * 0.35; y = p[1] + (D / 2 - p[1]) * 0.35;
          }
          if (snapOn) { x = Math.round(x * 2) / 2; y = Math.round(y * 2) / 2; }
          f.pos[d.id] = [Math.max(0, Math.min(W, x)), Math.max(0, Math.min(D, y))];
        });
      });
      toast("整列しました（↩で元に戻せます）");
    };
  });
  document.getElementById("applySet").onclick = () => {
    const w = +document.getElementById("stW").value, d = +document.getElementById("stD").value;
    const bpm = +document.getElementById("bpmIn").value;
    mutate(() => {
      if (w >= 4 && w <= 60) state.stage.w = w;
      if (d >= 3 && d <= 40) state.stage.d = d;
      if (bpm >= 40 && bpm <= 240) state.bpm = bpm;
      // はみ出したダンサーを収める
      for (const f of state.formations) for (const id in f.pos) {
        f.pos[id][0] = Math.min(f.pos[id][0], state.stage.w);
        f.pos[id][1] = Math.min(f.pos[id][1], state.stage.d);
      }
    });
    closeModal(); fitView();
  };
};

  document.getElementById("fmRight").onclick = () => {

      state.formations.splice(idx, 1);
      curF = Math.max(0, idx - 1);
    });

function hasBridge() { return typeof window.AndroidBridge !== "undefined"; }

function fileNameSafe(s) { return (s || "formation").replace(/[\\/:*?"<>|]/g, "_"); }

function exportJson() {
  const json = JSON.stringify(state, null, 1);
  const name = fileNameSafe(state.name) + ".formation.json";
  if (hasBridge()) {
    AndroidBridge.saveFile(name, "application/json", btoa(unescape(encodeURIComponent(json))));
  } else {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([json], { type: "application/json" }));
    a.download = name; a.click();
  }
  toast("書き出しました");
}
function shareJson() {
  const json = JSON.stringify(state);
  if (hasBridge()) {
    AndroidBridge.shareText("フォーメーション: " + state.name, json);
  } else if (navigator.share) {
    navigator.share({ title: state.name, text: json }).catch(() => {});
  } else {
    exportJson();
  }
}
document.getElementById("fileInput").addEventListener("change", e => {
  const f = e.target.files && e.target.files[0];
  e.target.value = "";
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const st = JSON.parse(r.result);
      if (!st || !Array.isArray(st.dancers) || !Array.isArray(st.formations) || !st.stage)
        throw new Error("bad");
      st.name = (st.name || "読み込んだ作品") + "";
      createProject(st);
      toast("読み込みました: " + st.name);
    } catch (err) {
      alert("読み込みに失敗しました。フォーメーションメーカーのJSONファイルを選んでください。");
    }
  };
  r.readAsText(f);
});

function exportPng() {
  const n = state.formations.length;
  const cols = Math.min(3, n), rows = Math.ceil(n / cols);
  const sc = 34;
  const cw = state.stage.w * sc + 40, ch = state.stage.d * sc + 90;
  const c = document.createElement("canvas");
  c.width = cols * cw + 40; c.height = rows * ch + 70;
  const x = c.getContext("2d");
  x.fillStyle = "#ffffff"; x.fillRect(0, 0, c.width, c.height);
  x.fillStyle = "#222"; x.font = "bold 26px sans-serif";
  x.textAlign = "left"; x.textBaseline = "top";
  x.fillText(state.name, 24, 20);
  x.font = "13px sans-serif"; x.fillStyle = "#777";
  x.textAlign = "right";
  x.fillText("メンバー " + state.dancers.length + "人 / BPM " + state.bpm + " / ステージ " +
    state.stage.w + "×" + state.stage.d + "m", c.width - 24, 30);
  const selBak = new Set(selected); selected = new Set();
  state.formations.forEach((f, i) => {
    const gx = 24 + (i % cols) * cw, gy = 70 + Math.floor(i / cols) * ch;
    x.fillStyle = "#333"; x.font = "bold 16px sans-serif";
    x.textAlign = "left"; x.textBaseline = "top";
    x.fillText((i + 1) + ". " + f.name + "（" + f.counts + "カウント）", gx, gy);
    drawFormation(x, f, sc, gx, gy + 26, { light: true });
    if (f.note) {
      x.fillStyle = "#8a6d00"; x.font = "12px sans-serif";
      x.fillText("📝 " + f.note.replace(/\n/g, " ").slice(0, 60), gx, gy + 32 + state.stage.d * sc);
    }
  });
  selected = selBak;
  const name = fileNameSafe(state.name) + "_formations.png";
  if (hasBridge()) {
    const b64 = c.toDataURL("image/png").split(",")[1];
    AndroidBridge.saveFile(name, "image/png", b64);
  } else {
    const a = document.createElement("a");
    a.href = c.toDataURL("image/png"); a.download = name; a.click();
  }
  toast("画像を書き出しました");
}

/* ================= 音楽同期 ================= */
let audioEl = null, musicUrl = null, musicReady = false, previewing = false;

function idbOpen() {
  return new Promise((res, rej) => {
    const r = indexedDB.open("fm_audio", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("audio");
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
function idbPut(key, blob) {
  return idbOpen().then(db => new Promise((res, rej) => {
    const tx = db.transaction("audio", "readwrite");
    tx.objectStore("audio").put(blob, key);
    tx.oncomplete = res; tx.onerror = () => rej(tx.error);
  }));
}
function idbGet(key) {
  return idbOpen().then(db => new Promise((res, rej) => {
    const rq = db.transaction("audio").objectStore("audio").get(key);
    rq.onsuccess = () => res(rq.result || null);
    rq.onerror = () => rej(rq.error);
  }));
}
function idbDel(key) {
  return idbOpen().then(db => new Promise(res => {
    const tx = db.transaction("audio", "readwrite");
    tx.objectStore("audio").delete(key);
    tx.oncomplete = res; tx.onerror = res;
  })).catch(() => {});
}

function fmtTime(t) {
  if (t == null || isNaN(t)) return "";
  const m = Math.floor(t / 60), s = t - m * 60;
  return m + ":" + (s < 10 ? "0" : "") + s.toFixed(1);
}
function parseTime(str) {
  str = (str || "").trim();
  if (!str) return null;
  const m = str.match(/^(?:(\d+):)?(\d+(?:\.\d+)?)$/);
  if (!m) return null;
  return (m[1] ? +m[1] * 60 : 0) + +m[2];
}

function teardownAudio() {
  if (audioEl) { audioEl.pause(); audioEl = null; }
  if (musicUrl) { URL.revokeObjectURL(musicUrl); musicUrl = null; }
  musicReady = false; previewing = false;
  updateMusicUI();
}
function loadAudioBlob(blob) {
  teardownAudio();
  musicUrl = URL.createObjectURL(blob);
  audioEl = new Audio(musicUrl);
  audioEl.preload = "auto";
  audioEl.addEventListener("loadedmetadata", () => {
    musicReady = true; updateMusicUI();
  });
  audioEl.addEventListener("error", () => {
    toast("この音楽ファイルは再生できません");
    teardownAudio();
  });
}
// 作品切替時に呼ぶ：保存済み音楽を読み直す
function setupAudioForProject() {
  teardownAudio();
  if (state && state.music && curProjId) {
    idbGet(curProjId).then(blob => {
      if (blob) loadAudioBlob(blob);
      else updateMusicUI();
    }).catch(() => {});
  }
}
function updateMusicUI() {
  const row = document.getElementById("musicRow");
  row.classList.toggle("show", musicReady);
  document.getElementById("musicBtn").classList.toggle("on", musicReady);
  if (musicReady) {
    document.getElementById("mDur").textContent = fmtTime(audioEl.duration);
    updateSeekUI();
  }
}
function updateSeekUI() {
  if (!musicReady) return;
  const T = audioEl.currentTime, D = audioEl.duration || 1;
  document.getElementById("mTime").textContent = fmtTime(T);
  document.getElementById("seek").value = Math.round(T / D * 1000);
}

document.getElementById("musicInput").addEventListener("change", e => {
  const f = e.target.files && e.target.files[0];
  e.target.value = "";
  if (!f) return;
  idbPut(curProjId, f).then(() => {
    mutate(() => { state.music = { name: f.name }; });
    loadAudioBlob(f);
    toast("音楽を読み込みました: " + f.name);
    closeModal();
  }).catch(() => {
    // IndexedDBが使えない環境でも今回のセッション中は再生できるようにする
    mutate(() => { state.music = { name: f.name }; });
    loadAudioBlob(f);
    toast("読み込みました（この端末では再起動後に再読み込みが必要です）");
    closeModal();
  });
});

document.getElementById("musicBtn").onclick = openMusicModal;
function openMusicModal() {
  if (playing) stopPlay();
  const has = !!(state.music && state.music.name);
  const marked = state.formations.filter((f, i) => i > 0 && f.t != null).length;
  openModal(
    '<h2>音楽同期</h2>' +
    (has
      ? '<p style="font-size:13px;margin-bottom:8px">🎵 ' + esc(state.music.name) +
        (musicReady ? '（' + fmtTime(audioEl.duration) + '）' : '（読み込み中/再生不可）') + '</p>'
      : '<p style="font-size:13px;color:var(--dim);margin-bottom:8px">音楽ファイル（mp3 / m4a / wav など）を読み込むと、曲に合わせて隊形を再生できます。</p>') +
    '<button class="btn wide primary" id="musLoad">📂 音楽ファイルを読み込む</button>' +
    (has ? '<button class="btn wide danger" id="musRemove">🗑 音楽を削除</button>' : '') +
    '<h3>隊形のタイミング設定（' + marked + '/' + Math.max(0, state.formations.length - 1) + '）</h3>' +
    '<div class="helpText" style="font-size:12px">' +
    '① 音楽を読み込んで <b>▶</b> で再生<br>' +
    '② 隊形がピッタリ決まる瞬間に <b>⏱ マーク</b> をタップ → 隊形2、隊形3…の順に時間が記録されます<br>' +
    '③ もう一度 ▶ を押すと、曲に合わせて隊形が動きます<br>' +
    '・細かい修正は隊形チップを再タップ →「曲の時間」で編集<br>' +
    '・シークバーで曲の途中へジャンプしてプレビューできます<br>' +
    '・移動にかかる長さは各隊形の「カウント数」×BPMで決まり、指定時間ちょうどに隊形が完成します</div>' +
    (marked ? '<button class="btn wide" id="musClear" style="margin-top:10px">⏱ タイム設定を全てクリア</button>' : '') +
    '<div class="mrow" style="margin-top:10px"><button class="btn" id="musClose">閉じる</button></div>' +
    '<p style="font-size:11px;color:var(--dim);margin-top:8px">※ 音楽はこの端末内にのみ保存されます（JSON書き出しには含まれません）</p>'
  );
  document.getElementById("musLoad").onclick = () => document.getElementById("musicInput").click();
  document.getElementById("musClose").onclick = closeModal;
  const rm = document.getElementById("musRemove");
  if (rm) rm.onclick = () => {
    if (!confirm("音楽を削除しますか？（タイム設定は残ります）")) return;
    idbDel(curProjId);
    mutate(() => { delete state.music; });
    teardownAudio();
    closeModal();
  };
  const cl = document.getElementById("musClear");
  if (cl) cl.onclick = () => {
    if (!confirm("全ての隊形のタイム設定をクリアしますか？")) return;
    mutate(() => { state.formations.forEach(f => { delete f.t; }); });
    openMusicModal();
  };
}

// 音楽時刻Tから隊形位置を計算して playPos / curF / playInfo を更新
function computePosAt(T) {
  const seq = [];
  state.formations.forEach((f, i) => {
    let t = (i === 0) ? (f.t != null ? f.t : 0) : f.t;
    if (t == null) return;
    if (seq.length && t < seq[seq.length - 1].t) t = seq[seq.length - 1].t;
    seq.push({ f, i, t });
  });
  playPos = {};
  if (!seq.length) return;
  let k = 0;
  while (k + 1 < seq.length && seq[k + 1].t <= T) k++;
  const cur = seq[k], nxt = seq[k + 1];
  const hold = () => {
    for (const d of state.dancers) if (cur.f.pos[d.id]) playPos[d.id] = cur.f.pos[d.id].slice();
    curF = cur.i;
    playInfo = "🎵 " + cur.f.name;
  };
  if (!nxt || T <= cur.t) { hold(); return; }
  const win = nxt.t - cur.t;
  const moveDur = Math.max(0.3, Math.min(nxt.f.counts * 60 / (state.bpm || 120), win));
  const ms = nxt.t - moveDur;
  if (T < ms) { hold(); return; }
  const t0 = Math.min(1, (T - ms) / moveDur), tt = t0 * t0 * (3 - 2 * t0);
  curF = nxt.i;
  for (const d of state.dancers) {
    const pa = cur.f.pos[d.id], pb = nxt.f.pos[d.id];
    if (pa && pb) playPos[d.id] = [pa[0] + (pb[0] - pa[0]) * tt, pa[1] + (pb[1] - pa[1]) * tt];
    else if (pb) playPos[d.id] = pb.slice();
  }
  playInfo = "🎵 " + cur.f.name + " → " + nxt.f.name + "（" + fmtTime(T) + "）";
}

function musicPlay() {
  playing = true;
  document.getElementById("playBtn").textContent = "■";
  document.getElementById("playBtn").classList.add("playing");
  document.getElementById("markBtn").classList.add("show");
  if (audioEl.ended || audioEl.duration - audioEl.currentTime < 0.2) audioEl.currentTime = 0;
  audioEl.play();
  const step = () => {
    if (!playing) return;
    if (audioEl.ended) { stopPlay(); return; }
    computePosAt(audioEl.currentTime);
    updateSeekUI();
    render(); tlUpdate();
    playReq = requestAnimationFrame(step);
  };
  playReq = requestAnimationFrame(step);
}

document.getElementById("markBtn").onclick = () => {
  if (!playing || !musicReady) return;
  const idx = state.formations.findIndex((f, i) => i > 0 && f.t == null);
  if (idx < 0) { toast("全隊形のタイム設定済みです（隊形チップ再タップで修正）"); return; }
  state.formations[idx].t = Math.round(audioEl.currentTime * 10) / 10;
  saveNow(); renderTimeline();
  toast("⏱ " + state.formations[idx].name + " = " + fmtTime(state.formations[idx].t));
};

document.getElementById("seek").addEventListener("input", e => {
  if (!musicReady) return;
  audioEl.currentTime = (+e.target.value / 1000) * (audioEl.duration || 0);
  updateSeekUI();
  if (!playing) {           // 停止中はその時点の隊形をプレビュー
    previewing = true;
    computePosAt(audioEl.currentTime);
    render(); tlUpdate();
  }
});

/* ================= ヘッダー/サイドボタン ================= */
document.getElementById("undoBtn").onclick = doUndo;
document.getElementById("redoBtn").onclick = doRedo;
document.getElementById("fitBtn").onclick = fitView;
document.getElementById("snapBtn").onclick = function () {
  snapOn = !snapOn; this.classList.toggle("on", snapOn);
  toast(snapOn ? "グリッド吸着 ON（0.5m単位）" : "グリッド吸着 OFF");
};
document.getElementById("ghostBtn").onclick = function () {
  ghostOn = !ghostOn; this.classList.toggle("on", ghostOn);
  render();
};
document.getElementById("multiBtn").onclick = function () {
  multiMode = !multiMode; this.classList.toggle("on", multiMode);
  if (!multiMode) selected.clear();
  render();
  toast(multiMode ? "複数選択モード ON：タップで追加/解除" : "複数選択モード OFF");
};
document.getElementById("projName").onclick = () => {
  const name = prompt("作品名", state.name);
  if (name === null) return;
  mutate(() => { state.name = name.trim() || state.name; });
};

/* Android 戻るボタン連携 */
window.appBack = function () {
  if (overlay.classList.contains("show")) { closeModal(); return "handled"; }
  if (playing) { stopPlay(); return "handled"; }
  return "exit";
};

/* ================= 画面更新 ================= */
function refreshAll() {
  document.getElementById("projName").textContent = state.name;
  document.getElementById("snapBtn").classList.toggle("on", snapOn);
  document.getElementById("ghostBtn").classList.toggle("on", ghostOn);
  document.getElementById("multiBtn").classList.toggle("on", multiMode);
  updateUndoBtns();
  renderTimeline();
  render();
}

/* ================= 起動 ================= */
(function init() {
  const cur = localStorage.getItem(LS_CURRENT);
  if (!(cur && openProject(cur))) {
    createProject(newProject());
    // 初回起動時は使い方を表示
    if (!localStorage.getItem("fm_seen_help")) {
      localStorage.setItem("fm_seen_help", "1");
      setTimeout(openHelpModal, 400);
    }
  }
  resizeCanvas(); fitView();
})();
</script>
